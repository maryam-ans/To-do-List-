<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List with Sound</title>
  
  <style>
  * {
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
  }

  body {
    background: linear-gradient(135deg, #89f7fe, #66a6ff);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    background: white;
    padding: 2rem;
    border-radius: 1rem;
    width: 350px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    text-align: center;
  }

  h2 {
    color: #333;
    margin-bottom: 1.5rem;
  }

  input {
    width: 70%;
    padding: 0.6rem;
    border: 2px solid #ddd;
    border-radius: 0.5rem;
    outline: none;
    transition: 0.3s;
  }

  input:focus {
    border-color: #66a6ff;
  }

  button {
    background-color: #66a6ff;
    border: none;
    color: white;
    padding: 0.6rem 1rem;
    border-radius: 0.5rem;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background-color: #3d8bff;
    transform: scale(1.05);
  }

  ul {
    list-style: none;
    padding: 0;
    margin-top: 1rem;
    max-height: 250px;
    overflow-y: auto;
  }

  li {
    background: #f7f7f7;
    padding: 0.7rem;
    margin-bottom: 0.6rem;
    border-radius: 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.3s;
  }

  li:hover {
    background: #eaf4ff;
    transform: translateX(3px);
  }

  li.done {
    background: #e2ffe2;
    color: #4caf50;
    text-decoration: line-through;
  }

  li.done:hover {
    background: #d8fcd8;
  }

  .delete-btn {
    background: transparent;
    border: none;
    color: #ff4d4d;
    font-weight: bold;
    cursor: pointer;
    font-size: 1.2rem;
    transition: 0.3s;
  }

  .delete-btn:hover {
    transform: scale(1.2);
  }
</style>

</head>
<body>
  <div class="container">
    <h2>My To-Do List 🎯</h2>
    <input type="text" id="taskInput" placeholder="Add a task...">
    <button id="addBtn">Add</button>
    <ul id="taskList"></ul>
    <audio id="dingSound" src="ding.mp3"></audio>
  </div>

  <script src="script.js"></script>
</body>

</html>
